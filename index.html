<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender-Automat - Kleiderspende</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-section">
                <img src="assets/logo.png" alt="Gender-Automat Logo" class="logo">
                <h1>Gender-Automat</h1>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#home">Startseite</a></li>
                    <li><a href="#spende">Spenden</a></li>
                    <li><a href="#kontakt">Kontakt</a></li>
                    <li><a href="#impressum">Impressum</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="content-area">
        <div class="container">
            <section id="spende" class="donation-section">
                <h2>Kleiderspende registrieren</h2>
                <p>Bitte wählen Sie, wie Sie Ihre Spende übergeben möchten:</p>

                <div class="donation-type-selector">
                    <label class="radio-label">
                        <input type="radio" name="donation_type" value="pickup" checked>
                        <span>Persönliche Übergabe an der Geschäftsstelle</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="donation_type" value="collection">
                        <span>Abholung durch Sammelfahrzeug</span>
                    </label>
                </div>

                <form id="donationForm" class="donation-form">
                    <!-- Clothing Type -->
                    <div class="form-group">
                        <label for="clothingType">Art der Kleidung:</label>
                        <select id="clothingType" name="clothingType" required>
                            <option value="">-- Bitte wählen --</option>
                            <option value="womens">Frauenkleidung</option>
                            <option value="mens">Herrenkleidung</option>
                            <option value="kids">Kinderkleidung</option>
                            <option value="mixed">Gemischte Kleidung</option>
                        </select>
                    </div>

                    <!-- Crisis Zone -->
                    <div class="form-group">
                        <label for="crisisZone">Krisengebiet:</label>
                        <select id="crisisZone" name="crisisZone" required>
                            <option value="">-- Bitte wählen --</option>
                            <option value="ukraine">Ukraine</option>
                            <option value="syria">Syrien</option>
                            <option value="afghanistan">Afghanistan</option>
                            <option value="yemen">Jemen</option>
                            <option value="other">Sonstiges</option>
                        </select>
                    </div>

                    <!-- Pickup Address (only for collection) -->
                    <div id="pickupAddressSection" class="form-group hidden">
                        <label for="pickupAddress">Abholadresse:</label>
                        <input type="text" id="pickupAddress" name="pickupAddress" placeholder="Straße und Hausnummer">
                        
                        <label for="pickupPostalCode">Postleitzahl:</label>
                        <input type="text" id="pickupPostalCode" name="pickupPostalCode" placeholder="z.B. 12345" maxlength="5">
                        
                        <label for="pickupCity">Stadt:</label>
                        <input type="text" id="pickupCity" name="pickupCity" placeholder="Stadt">
                    </div>

                    <!-- Submit Button -->
                    <div class="form-group">
                        <button type="submit" class="btn-submit">Spende registrieren</button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-content">
                <h3>Rechtliche Hinweise</h3>
                <p>&copy; 2026 Gender-Automat. Alle Rechte vorbehalten.</p>
                <p>
                    <a href="#datenschutz">Datenschutz</a> | 
                    <a href="#impressum">Impressum</a> | 
                    <a href="#agb">AGB</a>
                </p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
